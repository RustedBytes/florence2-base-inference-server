[package]
name = "florence2-base-inference-server"
version = "0.1.0"
edition = "2024"
authors = ["Yehor Smoliakov <egorsmkv@gmail.com>"]
license = "Apache-2.0"

[features]
default = []
cuda = ["ort/cuda"]

[dependencies]
anyhow = "1.0.100"
askama = "0.14.0"
async-channel = "2.5.0"
axum = { version = "0.8.7", features = ["multipart"] }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png", "webp", "bmp", "tiff"] }
env_logger = "0.11.8"
half = "2.7.1"
log = "0.4.28"
ort = { version = "2.0.0-rc.12", features = ["coreml", "half", "xnnpack"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
thiserror = "2.0.17"
time = { version = "0.3.44", features = ["formatting", "macros", "parsing", "serde", "serde-well-known"] }
tokio = { version = "1.48.0", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "sync"] }
toml = "0.8"
tokenizers = "0.23.1"
tower-http = { version = "0.6.6", features = ["cors"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }
