services:
  florence2:
    build:
      context: .
      dockerfile: Containerfile
    image: florence2-base-inference-server:local
    ports:
      - "3000:3000"
    environment:
      BIND_ADDR: 0.0.0.0:3000
      DATA_DIR: /app/data
      RUST_LOG: info,ort=warn
    volumes:
      - ./Florence-2-base:/app/Florence-2-base:ro
      - florence2-data:/app/data
    restart: unless-stopped

volumes:
  florence2-data:
